name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository policy
        run: python scripts/check_repository.py
      - name: Test governed ingestion project
        run: python -m unittest discover -s projects/governed-ingestion/tests -v
      - name: Build governed ingestion wheel
        run: >-
          python -m pip wheel --no-cache-dir --no-deps
          --wheel-dir projects/governed-ingestion/dist
          projects/governed-ingestion
